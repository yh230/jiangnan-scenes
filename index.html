<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1414" />
    <meta
      name="description"
      content="江南双景——听澜阁与烟江钓叟。两幅用 Three.js 程序化构建的东方场景，底部 Tab 一键切换，可拖动旋转、滚轮缩放、自动环游与重置视角。"
    />
    <title>江南双景 · 听澜阁与烟江钓叟</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231b2c31'/%3E%3Cpath d='M10 31l22-15 22 15' fill='%23d9c39a'/%3E%3Cpath d='M14 31h36M18 45c7-5 21-5 28 0M10 54c8-5 36-5 44 0' stroke='%23d9c39a' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app">
      <div id="stage" aria-label="江南双景三维场景"></div>
      <div class="vignette" aria-hidden="true"></div>
      <div id="scene-fade" class="scene-fade" aria-hidden="true"></div>

      <header class="brand" aria-label="听澜阁">
        <div class="seal" aria-hidden="true"><span>听</span><span>澜</span></div>
        <div class="brand-copy">
          <h1>听澜阁</h1>
          <p class="brand-en">PAVILION BY THE WATER</p>
          <span class="brand-rule" aria-hidden="true"></span>
        </div>
      </header>

      <div class="controls" role="group" aria-label="视角控制">
        <button
          id="auto-rotate"
          class="control is-active"
          type="button"
          aria-pressed="true"
          title="开启或关闭自动环游"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 11.2a8 8 0 1 1-2.4-6.1" />
            <path d="M20 4.4v6.8h-6.8" />
          </svg>
          <span class="control-label">自动环游</span>
          <i class="control-lamp" aria-hidden="true"></i>
        </button>
        <button id="reset-view" class="control" type="button" title="回到初始视角">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4.4 12a7.6 7.6 0 1 0 2.3-5.4" />
            <path d="M4.2 4.6v6.6h6.6" />
            <circle cx="12" cy="12" r="2.4" />
          </svg>
          <span class="control-label">重置视角</span>
        </button>
      </div>

      <div class="hint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
          <rect x="7.5" y="3.2" width="9" height="14" rx="4.5" />
          <path d="M12 7.1v3.2" />
        </svg>
        <span class="hint-desktop">拖动旋转 · 滚轮缩放 · 双击复位</span>
        <span class="hint-touch">单指旋转 · 双指缩放 · 双击复位</span>
      </div>

      <aside class="caption" aria-hidden="true">
        <span class="caption-line"></span>
        <p>江南一隅 · 暮色初上</p>
        <small>REFERENCE PROMPT · STUDY</small>
      </aside>

      <nav class="scene-tabs" role="tablist" aria-label="场景切换">
        <span class="scene-tabs-label" aria-hidden="true">江南双景</span>
        <span class="scene-tabs-sep" aria-hidden="true"></span>
        <button
          class="scene-tab is-active"
          type="button"
          role="tab"
          data-scene="tinglan"
          aria-selected="true"
          aria-controls="stage"
          tabindex="0"
        >
          <span class="tab-num" aria-hidden="true">01</span>
          <span class="tab-copy"><strong>听澜阁</strong><small>PAVILION</small></span>
        </button>
        <span class="tab-divider" aria-hidden="true"></span>
        <button
          class="scene-tab"
          type="button"
          role="tab"
          data-scene="angler"
          aria-selected="false"
          aria-controls="stage"
          tabindex="-1"
        >
          <span class="tab-num" aria-hidden="true">02</span>
          <span class="tab-copy"><strong>烟江钓叟</strong><small>RIVER ANGLER</small></span>
        </button>
      </nav>

      <div id="loader" role="status" aria-live="polite">
        <div class="loader-glow" aria-hidden="true"></div>
        <div class="loader-inner">
          <div class="loader-seal" aria-hidden="true"><span>江</span><span>南</span></div>
          <h2>江南双景</h2>
          <div class="loader-track" aria-hidden="true"><span></span></div>
          <p>一阁一筏 · 静候光临</p>
        </div>
      </div>

      <noscript>
        <div class="noscript">请启用 JavaScript 以进入江南双景。</div>
      </noscript>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
